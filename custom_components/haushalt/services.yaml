erledigt:
  fields:
    aufgabe_id:
      required: true
      example: "01JABCDEF..."
      selector:
        text:

saugen:
  fields:
    zimmer:
      required: false
      example: "19,20"
      selector:
        text:
    start_in_min:
      required: false
      example: 20
      selector:
        select:
          options:
            - "0"
            - "5"
            - "20"
            - "60"

sauger:
  fields:
    aktion:
      required: true
      selector:
        select:
          options:
            - pausieren
            - fortsetzen
            - abbrechen
            - reinigen
