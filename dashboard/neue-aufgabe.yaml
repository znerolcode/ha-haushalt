# Dashboard "Neue Aufgabe": Aufgaben anlegen ohne Administratorrechte.
# Einrichten: Einstellungen > Dashboards > Dashboard hinzufügen > "Neues Dashboard von Grund auf",
# Titel "Neue Aufgabe", URL "neue-aufgabe", "Nur für Administratoren" aus.
# Dann im Dashboard: Stift > drei Punkte > Raw-Konfigurationseditor, alles ersetzen durch diese Datei.
# Der QR-Code am Flur-Display öffnet diese Seite (siehe esphome/ANLEITUNG.md).
title: Neue Aufgabe
views:
  - title: Neue Aufgabe
    path: neu
    icon: mdi:plus-circle-outline
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: entities
            title: Neue Aufgabe
            show_header_toggle: false
            entities:
              - entity: text.neue_aufgabe_name
                name: Name
              - entity: select.neue_aufgabe_typ
                name: Typ
              - entity: select.neue_aufgabe_verpasst
                name: Wenn verpasst

          # Intervall: alle X Tage/Wochen/Monate ab dem letzten Abhaken
          - type: conditional
            conditions:
              - condition: state
                entity: select.neue_aufgabe_typ
                state: intervall
            card:
              type: entities
              title: Intervall
              entities:
                - entity: number.neue_aufgabe_anzahl
                  name: Alle
                - entity: select.neue_aufgabe_einheit
                  name: Einheit
                - entity: date.neue_aufgabe_zuletzt
                  name: Erledigt am

          # Fester Termin: ab einem Startdatum
          - type: conditional
            conditions:
              - condition: state
                entity: select.neue_aufgabe_typ
                state: termin
            card:
              type: entities
              title: Fester Termin
              entities:
                - entity: date.neue_aufgabe_datum
                  name: Erster Termin
                - entity: number.neue_aufgabe_anzahl
                  name: Wiederholen alle
                - entity: select.neue_aufgabe_einheit
                  name: Einheit
                - type: section
                  label: 0 = nicht wiederholen. Monate = immer am gleichen Datum.

          # Wochentage, nur beim festen Termin in Wochen
          - type: conditional
            conditions:
              - condition: state
                entity: select.neue_aufgabe_typ
                state: termin
              - condition: state
                entity: select.neue_aufgabe_einheit
                state: wochen
            card:
              type: grid
              title: An diesen Wochentagen
              columns: 7
              square: false
              cards:
                    - {type: button, entity: switch.neue_aufgabe_mo, name: Mo, show_state: false, icon_height: 28px}
                    - {type: button, entity: switch.neue_aufgabe_di, name: Di, show_state: false, icon_height: 28px}
                    - {type: button, entity: switch.neue_aufgabe_mi, name: Mi, show_state: false, icon_height: 28px}
                    - {type: button, entity: switch.neue_aufgabe_do, name: Do, show_state: false, icon_height: 28px}
                    - {type: button, entity: switch.neue_aufgabe_fr, name: Fr, show_state: false, icon_height: 28px}
                    - {type: button, entity: switch.neue_aufgabe_sa, name: Sa, show_state: false, icon_height: 28px}
                    - {type: button, entity: switch.neue_aufgabe_so, name: So, show_state: false, icon_height: 28px}

          - type: conditional
            conditions:
              - condition: state
                entity: select.neue_aufgabe_typ
                state: termin
            card:
              type: entities
              entities:
                - entity: text.neue_aufgabe_weitere
                  name: Weitere Termine (TT.MM.JJJJ, …)

          # Bleibt stehen: Termin entfällt, wenn kurz vorher erledigt
          - type: conditional
            conditions:
              - condition: state
                entity: select.neue_aufgabe_typ
                state: termin
              - condition: state
                entity: select.neue_aufgabe_verpasst
                state: stehen
            card:
              type: entities
              entities:
                - entity: number.neue_aufgabe_mindestabstand
                  name: Mindestabstand (Tage)

          # Verschwindet: bis wann am Fälligkeitstag
          - type: conditional
            conditions:
              - condition: state
                entity: select.neue_aufgabe_verpasst
                state: weg
            card:
              type: entities
              entities:
                - entity: select.neue_aufgabe_frist
                  name: Frist

          - type: button
            name: Aufgabe anlegen
            icon: mdi:plus-circle-outline
            icon_height: 40px
            show_state: false
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.neue_aufgabe_anlegen

          # Bestätigung, sobald eine Aufgabe angelegt wurde
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.neue_aufgabe_meldung
                state_not: unknown
            card:
              type: markdown
              content: >-
                {% set zeit = state_attr('sensor.neue_aufgabe_meldung', 'zeit') %}
                ✓ Zuletzt angelegt: **{{ states('sensor.neue_aufgabe_meldung') }}**
                {% if zeit %}({{ as_timestamp(zeit) | timestamp_custom('%d.%m. %H:%M') }}){% endif %}
