# Flur-Display: E-Ink 7,5" (Waveshare V2) mit Drehregler, zeigt Haushalt-Aufgaben, Gefrierer und Wetter.
# Wird als Paket in die Gerätekonfiguration eingebunden, siehe ANLEITUNG.md im selben Ordner.
# WLAN, API und OTA kommen aus der Gerätekonfiguration, die ESPHome beim Anlegen erzeugt.

substitutions:
  # Sensor für die Innentemperatur in der Kopfzeile, in der Gerätekonfiguration überschreiben
  innen_temperatur: sensor.flur_temperatur
  # Sensor für die Aussentemperatur in der Kopfzeile (Standard: Balkon)
  aussen_temperatur: sensor.xiaomi_atc1_temperature
  # Ziel des QR-Codes bei "+ Neue Aufgabe". Ohne Änderung öffnet er die Haushalt-Seite
  # in HA (nur für Administratoren). Für alle Konten: Adresse des Dashboards
  # "Neue Aufgabe" eintragen, z.B. http://192.168.178.10:8123/neue-aufgabe/neu
  neue_aufgabe_url: https://my.home-assistant.io/redirect/integration/?domain=haushalt
  # Ziel des QR-Codes bei "+ Einfrieren": Tab Einfrieren im Dashboard "Gefrierer"
  # (dashboard/gefrierer.yaml), z.B. http://192.168.178.10:8123/haushalt-gefrierer/einfrieren
  gefrierer_url: http://homeassistant.local:8123/haushalt-gefrierer/einfrieren

# Angepasster Display-Treiber aus diesem Repository: sendet das Bild in einem Stück
# statt Byte für Byte (sonst dauert jeder Schritt mehrere Sekunden)
external_components:
  - source:
      type: git
      url: https://github.com/znerolcode/ha-haushalt
      ref: main
      path: esphome/components
    components: [waveshare_epaper]
    refresh: 0s

esp32:
  # Ein volles Bild an das Display zu senden dauert länger als die üblichen 5 Sekunden
  watchdog_timeout: 30s

esphome:
  includes:
    - grundriss.h
    - flur_display.h
  on_boot:
    priority: -100
    then:
      - component.update: epaper

time:
  - platform: homeassistant
    id: zeit
    timezone: Europe/Zurich
    on_time_sync:
      - script.execute: zeichnen
    on_time:
      # Alle 5 Minuten neu zeichnen, nachts (23 bis 6 Uhr) nicht. Ohne Bedienung immer
      # gründlich (ca. 4 s Flackern): voller Kontrast, keine Geisterbilder.
      - minutes: /5
        seconds: 0
        then:
          - if:
              condition:
                lambda: 'return id(zeit).now().hour >= 6 && id(zeit).now().hour < 23 && flur::cursor < 0;'
              then:
                - lambda: 'id(voll_noetig) = true;'
                - script.execute: zeichnen

text_sensor:
  - platform: homeassistant
    id: aufgaben
    entity_id: sensor.aufgaben
    attribute: anzeige
    on_value:
      - script.execute: daten_neu
  # Staubsauger-Zeile: zustand|uhrzeit|zimmer, leer ohne Staubsauger in der Integration
  - platform: homeassistant
    id: sauger
    entity_id: sensor.aufgaben
    attribute: sauger
    on_value:
      - lambda: 'flur::sauger_roh = x;'
      - script.execute: daten_neu
  # Kacheln auf dem Homescreen, je 3 Zeilen 'vor|hervor|nach'
  - platform: homeassistant
    id: ha_kachel_haushalt
    entity_id: sensor.aufgaben
    attribute: kachel
    internal: true
    on_value:
      - lambda: 'flur::kachel_haushalt = x;'
      - script.execute: daten_neu
  # Details zur gewählten Aufgabe (rechte Spalte): id|rhythmus|zuletzt|termin,termin,termin
  - platform: homeassistant
    id: details
    entity_id: sensor.aufgaben
    attribute: details
    internal: true
    on_value:
      - lambda: 'flur::details_roh = x;'
      - script.execute: daten_neu
  # Letzter Einsatz des Staubsaugers: tag|start|ende|zimmer
  - platform: homeassistant
    id: ha_sauger_letzter
    entity_id: sensor.aufgaben
    attribute: sauger_letzter
    internal: true
    on_value:
      - lambda: 'flur::sauger_letzter = x;'
      - script.execute: daten_neu
  # Gefrierer: nur wenn in der Integration eingeschaltet, sonst gibt es keinen Homescreen
  - platform: homeassistant
    id: gefrierer
    entity_id: sensor.gefrierer
    attribute: anzeige
    internal: true
    on_value:
      - lambda: 'flur::gef_roh = x;'
      - script.execute: daten_neu
  - platform: homeassistant
    id: ha_kachel_gefrierer
    entity_id: sensor.gefrierer
    attribute: kachel
    internal: true
    on_value:
      - lambda: |-
          bool vorher = flur::home_aktiv();
          flur::kachel_gefrierer = x;
          // Gefrierer neu eingeschaltet: in Ruhe gleich den Homescreen zeigen
          if (!vorher && flur::home_aktiv() && flur::cursor < 0) flur::ruhe();
      - script.execute: daten_neu
  - platform: homeassistant
    id: wetter
    entity_id: sensor.display_wetter
    attribute: anzeige
    on_value:
      - script.execute: daten_neu

sensor:
  - platform: homeassistant
    id: innen
    entity_id: ${innen_temperatur}
  - platform: homeassistant
    id: aussen
    entity_id: ${aussen_temperatur}
  - platform: rotary_encoder
    id: regler
    pin_a:
      number: GPIO32
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO33
      mode:
        input: true
        pullup: true
    # Falls ein Rastschritt zwei Zeilen springt: auf 2 bzw. 4 erhöhen
    resolution: 1
    internal: true
    on_clockwise:
      - lambda: 'flur::drehen(1, id(aufgaben).state);'
      - script.execute: nach_eingabe
    on_anticlockwise:
      - lambda: 'flur::drehen(-1, id(aufgaben).state);'
      - script.execute: nach_eingabe

binary_sensor:
  - platform: gpio
    id: knopf
    internal: true
    pin:
      number: GPIO25
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_press:
      - script.execute: druecken

# Dieselbe Bedienung als Tasten in Home Assistant (z.B. ohne Drehregler)
button:
  - platform: template
    name: "Hoch"
    icon: mdi:chevron-up
    on_press:
      - lambda: 'flur::drehen(-1, id(aufgaben).state);'
      - script.execute: nach_eingabe
  - platform: template
    name: "Runter"
    icon: mdi:chevron-down
    on_press:
      - lambda: 'flur::drehen(1, id(aufgaben).state);'
      - script.execute: nach_eingabe
  - platform: template
    name: "Display reinigen"
    icon: mdi:broom
    entity_category: config
    on_press:
      - lambda: 'id(voll_noetig) = true;'
      - script.execute: zeichnen
  - platform: template
    name: "Drücken"
    icon: mdi:gesture-tap-button
    on_press:
      - script.execute: druecken

number:
  # Kontrast beim Drehen: 0 = schnell und blass (wie bisher), 10 = kräftig, aber träger.
  # Die Stufe gibt dem Display bei der Teil-Aktualisierung eine Temperatur vor; je tiefer,
  # desto länger werden die Partikel angetrieben. Ohne Bedienung wird ohnehin gründlich gezeichnet.
  - platform: template
    id: kontrast_drehen
    name: "Kontrast beim Drehen"
    icon: mdi:contrast-box
    entity_category: config
    mode: slider
    min_value: 0
    max_value: 10
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true
    on_value:
      - lambda: |-
          static const uint8_t grad[] = {110, 100, 90, 80, 70, 60, 50, 40, 30, 25, 20};
          int stufe = (int) x;
          if (stufe < 0) stufe = 0;
          if (stufe > 10) stufe = 10;
          id(epaper).set_teil_temperatur(grad[stufe]);
          ESP_LOGI("flur", "Kontrast beim Drehen: Stufe %d (%d Grad)", stufe, grad[stufe]);

switch:
  # Neuere Treiberplatinen (Rev 2.3) haben eine 9. Leitung PWR, die eingeschaltet sein muss
  - platform: gpio
    id: epaper_strom
    pin: GPIO26
    restore_mode: ALWAYS_ON
    internal: true
  # 3.3 V für den "+"-Pin des Drehreglers (KY-040): seine 10-kOhm-Pull-ups halten
  # CLK und DT stabil (das ESP32-Board hat nur einen 3V3-Pin, der fürs Display gebraucht wird)
  - platform: gpio
    id: regler_strom
    pin: GPIO27
    restore_mode: ALWAYS_ON
    internal: true

globals:
  # Nächstes Zeichnen als vollen Aufbau statt Teil-Aktualisierung.
  # Beim Start an, damit das Warte-Bild keinen Schatten hinterlässt.
  - id: voll_noetig
    type: bool
    initial_value: 'true'

script:
  # Knopf gedrückt: öffnen, abhaken, Auswahl bestätigen, entnehmen oder Staubsauger steuern
  - id: druecken
    then:
      - lambda: 'flur::druecken(id(aufgaben).state);'
      - if:
          condition:
            lambda: 'return flur::senden;'
          then:
            - homeassistant.action:
                action: haushalt.erledigt
                data:
                  aufgabe_id: !lambda 'return flur::senden_id;'
            - lambda: 'flur::senden = false;'
      - if:
          condition:
            lambda: 'return flur::saug_aktion == "saugen";'
          then:
            - homeassistant.action:
                action: haushalt.saugen
                data:
                  zimmer: !lambda 'return flur::saug_zimmer;'
                  start_in_min: !lambda 'return to_string(flur::saug_min);'
      - if:
          condition:
            lambda: 'return !flur::saug_aktion.empty() && flur::saug_aktion != "saugen";'
          then:
            - homeassistant.action:
                action: haushalt.sauger
                data:
                  aktion: !lambda 'return flur::saug_aktion;'
      - lambda: 'flur::saug_aktion.clear();'
      - if:
          condition:
            lambda: 'return flur::gef_senden;'
          then:
            - homeassistant.action:
                action: haushalt.entnehmen
                data:
                  artikel: !lambda 'return flur::gef_artikel;'
                  menge: !lambda 'return flur::gef_menge;'
            - lambda: 'flur::gef_senden = false;'
      - script.execute: nach_eingabe
  # Zeichnen, bei Bedarf als voller Aufbau
  - id: zeichnen
    then:
      - if:
          condition:
            lambda: 'return id(voll_noetig);'
          then:
            # Gründlicher Aufbau mit normaler Wellenform (ca. 4 s Flackern), löscht Geisterbilder
            - lambda: |-
                id(voll_noetig) = false;
                id(epaper).gruendlich_naechstes();
            - component.update: epaper
          else:
            - component.update: epaper
  # Nach jeder Eingabe: sofort zeichnen, dann Zeitlimits abwarten.
  # Nach 10 s bricht ein offenes Menü ab, nach 60 s geht es zurück in die Ruheansicht
  # (Homescreen bzw. ohne Gefrierer die Aufgabenliste).
  - id: nach_eingabe
    mode: restart
    then:
      - component.update: epaper
      - delay: 10s
      - if:
          condition:
            lambda: 'return flur::auswahl_offen();'
          then:
            - lambda: 'flur::auswahl_abbrechen();'
            - component.update: epaper
      - delay: 50s
      # Zurück in Ruhe: gründlich zeichnen, die schnellen Schritte beim Drehen sind blasser
      - lambda: |-
          flur::ruhe();
          id(voll_noetig) = true;
      - script.execute: zeichnen
  # Neue Daten aus Home Assistant: kurz sammeln, dann zeichnen.
  # Während der Bedienung schnell, sonst gründlich.
  - id: daten_neu
    mode: restart
    then:
      - delay: 2s
      - if:
          condition:
            lambda: |-
              int h = id(zeit).now().is_valid() ? id(zeit).now().hour : 12;
              return flur::cursor >= 0 || (h >= 6 && h < 23);
          then:
            - lambda: 'if (flur::cursor < 0) id(voll_noetig) = true;'
            - script.execute: zeichnen

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23

qr_code:
  - id: qr_neue_aufgabe
    value: ${neue_aufgabe_url}
  - id: qr_gefrierer
    value: ${gefrierer_url}

font:
  - file: "gfonts://Inter@700"
    id: f_datum
    size: 26
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Inter@400"
    id: f_meta
    size: 17
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Inter@400"
    id: f_klein
    size: 13
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Inter@700"
    id: f_titel
    size: 15
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Inter@700"
    id: f_gruppe
    size: 13
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Inter@600"
    id: f_zeile
    size: 21
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Inter@400"
    id: f_text
    size: 17
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Inter@700"
    id: f_hinweis
    size: 17
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Inter@700"
    id: f_option
    size: 18
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Inter@700"
    id: f_wtag
    size: 19
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Inter@700"
    id: f_wtemp
    size: 22
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Inter@400"
    id: f_wregen
    size: 17
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Inter@400"
    id: f_wtext
    size: 15
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Inter@700"
    id: f_qr_titel
    size: 28
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Inter@400"
    id: f_qr
    size: 18
    glyphsets: [GF_Latin_Core]
  # Wettersymbole und Staubsauger aus Material Design Icons
  - file:
      type: web
      url: https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/v7.4.47/fonts/materialdesignicons-webfont.ttf
    id: f_symbol
    size: 36
    glyphs: &symbole
      - "\U000F0599" # weather-sunny
      - "\U000F0595" # weather-partly-cloudy
      - "\U000F0590" # weather-cloudy
      - "\U000F0591" # weather-fog
      - "\U000F0592" # weather-hail
      - "\U000F0593" # weather-lightning
      - "\U000F067E" # weather-lightning-rainy
      - "\U000F0597" # weather-rainy
      - "\U000F0596" # weather-pouring
      - "\U000F0598" # weather-snowy
      - "\U000F067F" # weather-snowy-rainy
      - "\U000F059D" # weather-windy
      - "\U000F059E" # weather-windy-variant
      - "\U000F0026" # alert
      - "\U000F070D" # robot-vacuum

  - file:
      type: web
      url: https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/v7.4.47/fonts/materialdesignicons-webfont.ttf
    id: f_symbol_klein
    size: 18
    glyphs:
      - "\U000F058C" # water
      - "\U000F0717" # snowflake
      - "\U000F065A" # pot-steam (Meal-Prep)
      - "\U000F0141" # chevron-left (Zurück)

  # Symbole der Kacheln auf dem Homescreen
  - file:
      type: web
      url: https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/v7.4.47/fonts/materialdesignicons-webfont.ttf
    id: f_symbol_mittel
    size: 30
    glyphs:
      - "\U000F00E2" # broom
      - "\U000F0717" # snowflake

display:
  - platform: waveshare_epaper
    id: epaper
    model: 7.50inv2p
    cs_pin: GPIO5
    data_rate: 4MHz
    dc_pin: GPIO17
    reset_pin: GPIO16
    busy_pin:
      number: GPIO4
      inverted: true
    # Schnelle Aktualisierung beim Drehen, jede 30. voll; in Ruhe zeichnet das Skript "zeichnen" gründlich
    full_update_every: 30
    update_interval: never
    lambda: |-
      using namespace flur;
      const int B = 800;
      const auto SCHWARZ = COLOR_ON;
      const auto WEISS = COLOR_OFF;
      it.fill(WEISS);

      // Text kürzen, bis er in die Breite passt
      auto kuerzen = [&](esphome::font::Font *f, std::string s, int breite) {
        int x1, y1, w, h;
        it.get_text_bounds(0, 0, s.c_str(), f, TextAlign::TOP_LEFT, &x1, &y1, &w, &h);
        if (w <= breite) return s;
        while (!s.empty()) {
          // ganzes UTF-8-Zeichen entfernen
          do { s.pop_back(); } while (!s.empty() && (s.back() & 0xC0) == 0x80);
          std::string t = s + "…";
          it.get_text_bounds(0, 0, t.c_str(), f, TextAlign::TOP_LEFT, &x1, &y1, &w, &h);
          if (w <= breite) return t;
        }
        return s;
      };

      // ---- Kopfzeile ----
      static const char *TAGE[] = {"Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"};
      static const char *MONATE[] = {"Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"};
      auto jetzt = id(zeit).now();
      if (jetzt.is_valid()) {
        it.printf(20, 28, id(f_datum), SCHWARZ, TextAlign::CENTER_LEFT, "%s, %d. %s",
                  TAGE[jetzt.day_of_week - 1], jetzt.day_of_month, MONATE[jetzt.month - 1]);
        it.printf(B - 20, 46, id(f_klein), SCHWARZ, TextAlign::BASELINE_RIGHT, "aktualisiert %02d:%02d", jetzt.hour, jetzt.minute);
      }
      // "Aussen 8,2 °C · Innen 21,4 °C", fehlende Werte fallen weg
      auto temp = [](float w) {
        char t[16];
        snprintf(t, sizeof(t), "%.1f", w);
        std::string s = t;
        if (!s.empty() && s[0] == '-') s = "−" + s.substr(1);
        for (auto &c : s) if (c == '.') c = ',';
        return s + " °C";
      };
      std::string temps;
      if (id(aussen).has_state() && !std::isnan(id(aussen).state)) temps = "Aussen " + temp(id(aussen).state);
      if (id(innen).has_state() && !std::isnan(id(innen).state))
        temps += (temps.empty() ? "" : "  ·  ") + std::string("Innen ") + temp(id(innen).state);
      if (!temps.empty())
        it.print(B - 20, 24, id(f_meta), SCHWARZ, TextAlign::BASELINE_RIGHT, temps.c_str());
      it.filled_rectangle(0, 56, B, 3, SCHWARZ);

      // ---- Knöpfe nebeneinander, der gewählte schwarz ----
      auto knoepfe = [&](int x, int y, int breite, const std::vector<std::string> &namen, int aktiv) {
        int k = namen.size();
        int ob = (breite - (k - 1) * 8) / k;
        for (int o = 0; o < k; o++) {
          int ox = x + o * (ob + 8);
          if (o == aktiv) {
            it.filled_rectangle(ox, y, ob, 32, SCHWARZ);
            it.print(ox + ob / 2, y + 16, id(f_option), WEISS, TextAlign::CENTER, namen[o].c_str());
          } else {
            it.rectangle(ox, y, ob, 32, SCHWARZ);
            it.rectangle(ox + 1, y + 1, ob - 2, 30, SCHWARZ);
            it.print(ox + ob / 2, y + 16, id(f_option), SCHWARZ, TextAlign::CENTER, namen[o].c_str());
          }
        }
      };
      auto rahmen = [&](int x, int y, int b, int h) {
        for (int d = 0; d < 3; d++) it.rectangle(x + d, y + d, b - 2 * d, h - 2 * d, SCHWARZ);
      };

      // ---- Zimmer im Grundriss wählen ----
      if (modus == ZIMMER) {
        const int GX = 40, GY = 74, GH = 392;
        const float M = (float) GH / PLAN_H;
        auto px = [&](int v) { return GX + (int) ((v - PLAN_X) * M + 0.5f); };
        auto py = [&](int v) { return GY + (int) ((v - PLAN_Y) * M + 0.5f); };
        for (int i = 0; i < ANZAHL_ZIMMER; i++) {
          const auto &z = ZIMMER_LISTE[i];
          bool an = std::find(gewaehlt.begin(), gewaehlt.end(), z.id) != gewaehlt.end();
          bool hier = i == zimmer_cursor;
          int r = hier ? 5 : 2;
          for (int t = 0; t < z.anzahl; t++) {
            const auto &q = z.teile[t];
            it.filled_rectangle(px(q.x), py(q.y), px(q.x + q.b) - px(q.x), py(q.y + q.h) - py(q.y), SCHWARZ);
          }
          if (!an) {
            for (int t = 0; t < z.anzahl; t++) {
              const auto &q = z.teile[t];
              it.filled_rectangle(px(q.x) + r, py(q.y) + r, px(q.x + q.b) - px(q.x) - 2 * r, py(q.y + q.h) - py(q.y) - 2 * r, WEISS);
            }
            // Naht zwischen zwei Teilen desselben Zimmers wieder weiss machen
            if (z.anzahl == 2) {
              const auto &a = z.teile[0], &c = z.teile[1];
              if (a.x + a.b == c.x || c.x + c.b == a.x) {
                int kx = px(a.x + a.b == c.x ? c.x : a.x);
                int y0 = py(std::max(a.y, c.y)) + r, y1 = py(std::min(a.y + a.h, c.y + c.h)) - r;
                it.filled_rectangle(kx - r, y0, 2 * r, y1 - y0, WEISS);
              } else {
                int ky = py(a.y + a.h == c.y ? c.y : a.y);
                int x0 = px(std::max(a.x, c.x)) + r, x1 = px(std::min(a.x + a.b, c.x + c.b)) - r;
                it.filled_rectangle(x0, ky - r, x1 - x0, 2 * r, WEISS);
              }
            }
          }
          // Punkt in der Mitte zeigt, wo der Regler gerade steht
          if (hier) {
            const auto &q = z.teile[0];
            int mx = px(q.x + q.b / 2), my = py(q.y + q.h / 2);
            it.filled_circle(mx, my, 9, an ? WEISS : SCHWARZ);
          }
        }
        const int RX = 330;
        it.print(RX, 78, id(f_qr_titel), SCHWARZ, TextAlign::TOP_LEFT, "Zimmer wählen");
        it.print(RX, 120, id(f_qr), SCHWARZ, TextAlign::TOP_LEFT, "Drehen wählt, Drücken markiert.");
        it.print(RX, 144, id(f_qr), SCHWARZ, TextAlign::TOP_LEFT, "Markierte Zimmer sind schwarz.");
        it.print(RX, 190, id(f_gruppe), SCHWARZ, TextAlign::TOP_LEFT, "GEWÄHLT");
        std::string g = gewaehlt.empty() ? std::string("noch keines") : zimmer_text(gewaehlt);
        it.print(RX, 208, id(f_text), SCHWARZ, TextAlign::TOP_LEFT, kuerzen(id(f_text), g, B - 20 - RX).c_str());
        if (zimmer_cursor < ANZAHL_ZIMMER) {
          it.print(RX, 246, id(f_gruppe), SCHWARZ, TextAlign::TOP_LEFT, "REGLER STEHT AUF");
          it.print(RX, 264, id(f_datum), SCHWARZ, TextAlign::TOP_LEFT, ZIMMER_LISTE[zimmer_cursor].name);
        }
        static const char *KNOPF[] = {"Weiter", "Zurück"};
        for (int o = 0; o < 2; o++) {
          int oy = 318 + o * 46;
          if (zimmer_cursor == ANZAHL_ZIMMER + o) {
            it.filled_rectangle(RX, oy, 220, 38, SCHWARZ);
            it.print(RX + 110, oy + 19, id(f_option), WEISS, TextAlign::CENTER, KNOPF[o]);
          } else {
            it.rectangle(RX, oy, 220, 38, SCHWARZ);
            it.rectangle(RX + 1, oy + 1, 218, 36, SCHWARZ);
            it.print(RX + 110, oy + 19, id(f_option), SCHWARZ, TextAlign::CENTER, KNOPF[o]);
          }
        }
        if (zimmer_hinweis)
          it.print(RX + 236, 337, id(f_hinweis), SCHWARZ, TextAlign::CENTER_LEFT, "Erst ein Zimmer wählen");
        it.print(RX, 440, id(f_klein), SCHWARZ, TextAlign::TOP_LEFT, "Weiter und Zurück kommen nach dem letzten Zimmer");
        return;
      }

      // ---- QR-Codes: neue Aufgabe bzw. einfrieren ----
      if (modus == QR) {
        if (ansicht == GEFRIERER) {
          it.qr_code(150, 120, id(qr_gefrierer), SCHWARZ, 6);
          it.print(430, 150, id(f_qr_titel), SCHWARZ, TextAlign::TOP_LEFT, "Einfrieren");
          it.print(430, 200, id(f_qr), SCHWARZ, TextAlign::TOP_LEFT, "Mit dem Handy scannen.");
          it.print(430, 225, id(f_qr), SCHWARZ, TextAlign::TOP_LEFT, "Home Assistant öffnet das");
          it.print(430, 250, id(f_qr), SCHWARZ, TextAlign::TOP_LEFT, "Formular zum Einfrieren.");
        } else {
          it.qr_code(150, 120, id(qr_neue_aufgabe), SCHWARZ, 6);
          it.print(430, 150, id(f_qr_titel), SCHWARZ, TextAlign::TOP_LEFT, "Neue Aufgabe");
          it.print(430, 200, id(f_qr), SCHWARZ, TextAlign::TOP_LEFT, "Mit dem Handy scannen.");
          it.print(430, 225, id(f_qr), SCHWARZ, TextAlign::TOP_LEFT, "Home Assistant öffnet die");
          it.print(430, 250, id(f_qr), SCHWARZ, TextAlign::TOP_LEFT, "Haushalt-Seite.");
          it.print(430, 290, id(f_qr), SCHWARZ, TextAlign::TOP_LEFT, "Dort „Aufgabe hinzufügen“.");
        }
        it.print(430, 340, id(f_klein), SCHWARZ, TextAlign::TOP_LEFT, "Drücken schliesst, nach 60 s automatisch");
        return;
      }

      // ---- Spalten ----
      // Rechts das Wetter auf dem Homescreen, in den Listen Details zur gewählten Zeile.
      // Ohne Homescreen (Gefrierer aus) bleibt das Wetter neben den Aufgaben.
      const int LINKS_B = 470;
      const bool wetter_zeigen = ansicht == HOME || !home_aktiv();
      it.filled_rectangle(LINKS_B, 59, 3, 480 - 59, SCHWARZ);
      if (wetter_zeigen) {
        it.print(LINKS_B + 21, 70, id(f_titel), SCHWARZ, TextAlign::TOP_LEFT, "VORMITTAG");
        it.print(LINKS_B + 21 + (800 - 18 - LINKS_B - 21) / 2 + 6, 70, id(f_titel), SCHWARZ, TextAlign::TOP_LEFT, "NACHMITTAG");
      }
      const int ZB = LINKS_B - 36;  // Breite der Zeilen
      const char *HILFE = "Drehen wählt · Drücken bestätigt · 10 s warten bricht ab";

      // ---- Homescreen: zwei Kacheln ----
      if (ansicht == HOME) {
        // Kachelzeile 'vor|hervor|nach': der mittlere Teil weiss auf schwarz
        auto kachel_zeile = [&](int x, int y, const std::string &zeile, int breite) {
          auto f = teilen(zeile, '|');
          f.resize(3);
          int x1, y1, w, h;
          if (!f[0].empty()) {
            std::string t = kuerzen(id(f_text), f[0], breite);
            it.print(x, y, id(f_text), SCHWARZ, TextAlign::TOP_LEFT, t.c_str());
            it.get_text_bounds(x, y, t.c_str(), id(f_text), TextAlign::TOP_LEFT, &x1, &y1, &w, &h);
            x += w;
          }
          if (!f[1].empty()) {
            it.get_text_bounds(x + 5, y, f[1].c_str(), id(f_hinweis), TextAlign::TOP_LEFT, &x1, &y1, &w, &h);
            it.filled_rectangle(x, y - 3, w + 10, 26, SCHWARZ);
            it.print(x + 5, y, id(f_hinweis), WEISS, TextAlign::TOP_LEFT, f[1].c_str());
            x += w + 10;
          }
          if (!f[2].empty())
            it.print(x, y, id(f_text), SCHWARZ, TextAlign::TOP_LEFT, f[2].c_str());
        };
        static const char *TITEL[] = {"Haushalt", "Gefrierer"};
        static const char *SYMBOL[] = {"\U000F00E2", "\U000F0717"};  // broom, snowflake
        for (int k = 0; k < 2; k++) {
          int ky = 72 + k * 202, kh = 188;
          bool gew = cursor == k;
          if (gew) rahmen(20, ky, ZB, kh);
          else { it.rectangle(20, ky, ZB, kh, SCHWARZ); it.rectangle(21, ky + 1, ZB - 2, kh - 2, SCHWARZ); }
          it.print(36, ky + 34, id(f_symbol_mittel), SCHWARZ, TextAlign::CENTER_LEFT, SYMBOL[k]);
          it.print(76, ky + 34, id(f_qr_titel), SCHWARZ, TextAlign::CENTER_LEFT, TITEL[k]);
          if (gew) it.filled_triangle(ZB - 4, ky + 23, ZB - 4, ky + 45, ZB + 12, ky + 34, SCHWARZ);
          const std::string &roh = k == 0 ? kachel_haushalt : kachel_gefrierer;
          if (roh.empty()) {
            it.print(36, ky + 70, id(f_text), SCHWARZ, TextAlign::TOP_LEFT, "Warte auf Home Assistant …");
            continue;
          }
          auto zeilen = teilen(roh, '\n');
          for (int z = 0; z < 3 && z < (int) zeilen.size(); z++)
            kachel_zeile(36, ky + 72 + z * 34, zeilen[z], ZB - 32);
        }
      }

      // ---- Liste (Aufgaben oder Gefrierer) ab Höhe liste_y ----
      // Zeichnet Gruppenköpfe und Zeilen, scrollt so, dass die gewählte Zeile zu sehen ist.
      auto liste_zeichnen = [&](const std::vector<Eintrag> &liste, int liste_y, const char *leer) {
        int liste_h = 428 - liste_y;
        enum Art { KOPF, ZEILE, BESTAETIGUNG, ENTNAHME };
        struct Element { Art art; int index; int h; std::string text; };
        std::vector<Element> el;
        std::string gruppe = "-";
        bool nur_neu = std::count_if(liste.begin(), liste.end(), [](const Eintrag &e) { return !e.sauger && !e.zurueck; }) == 1;
        for (int i = 0; i < (int) liste.size(); i++) {
          const auto &e = liste[i];
          if (e.sauger || e.zurueck) continue;  // stehen fest oben
          if (e.neu) {
            el.push_back({KOPF, -1, 22, nur_neu ? leer : ""});
          } else if (e.gruppe != gruppe) {
            gruppe = e.gruppe;
            std::string g = gruppe;
            std::transform(g.begin(), g.end(), g.begin(), ::toupper);
            // toupper kennt keine Umlaute
            if (gruppe == "Überfällig") g = "ÜBERFÄLLIG";
            else if (gruppe == "Nächste Tage") g = "NÄCHSTE TAGE";
            else if (gruppe == "Später") g = "SPÄTER";
            el.push_back({KOPF, -1, 22, g});
          }
          el.push_back({ZEILE, i, 40, ""});
          if (i == cursor && modus == BESTAETIGEN) el.push_back({BESTAETIGUNG, i, 40, ""});
          if (i == cursor && modus == GEF_MENU) el.push_back({ENTNAHME, i, 100, ""});
        }

        // Sichtbaren Ausschnitt so legen, dass die gewählte Zeile ganz zu sehen ist
        int n = el.size();
        std::vector<int> y(n + 1, 0);
        for (int k = 0; k < n; k++) y[k + 1] = y[k] + el[k].h;
        if (cursor < 0 || liste[cursor].sauger || liste[cursor].zurueck) {
          oben = 0;
        } else {
          int sel = 0;
          while (sel < n && !(el[sel].art == ZEILE && el[sel].index == cursor)) sel++;
          int ende = sel + 1;
          while (ende < n && (el[ende].art == BESTAETIGUNG || el[ende].art == ENTNAHME)) ende++;
          int start = (sel > 0 && el[sel - 1].art == KOPF) ? sel - 1 : sel;
          oben = std::min(oben, n - 1);
          if (start < oben) oben = start;
          while (y[ende] - y[oben] > liste_h && oben < sel) oben++;
        }

        int darueber = 0, darunter = 0;
        for (int k = 0; k < oben; k++) if (el[k].art == ZEILE) darueber++;
        int ende = oben;
        while (ende < n && y[ende + 1] - y[oben] <= liste_h) ende++;
        // Gruppenkopf nicht allein am unteren Rand
        if (ende > oben && el[ende - 1].art == KOPF) ende--;
        for (int k = ende; k < n; k++) if (el[k].art == ZEILE) darunter++;

        for (int k = oben; k < ende; k++) {
          const auto &m = el[k];
          int ey = liste_y + y[k] - y[oben];
          if (m.art == KOPF) {
            it.print(28, ey + 7, id(f_gruppe), SCHWARZ, TextAlign::TOP_LEFT, m.text.c_str());
            continue;
          }
          const auto &e = liste[m.index];
          bool gewaehlt = m.index == cursor;
          if (m.art == ZEILE) {
            int zy = ey + 2, zh = 36;
            auto farbe = e.ueberfaellig ? WEISS : SCHWARZ;
            if (e.ueberfaellig) it.filled_rectangle(20, zy, ZB, zh, SCHWARZ);
            if (gewaehlt) {
              if (e.ueberfaellig) {
                it.rectangle(24, zy + 4, ZB - 8, zh - 8, WEISS);
                it.rectangle(25, zy + 5, ZB - 10, zh - 10, WEISS);
              } else {
                rahmen(20, zy, ZB, zh);
              }
              it.filled_triangle(30, zy + 9, 30, zy + 27, 45, zy + 18, farbe);
            }
            int text_b = 0;
            if (!e.text.empty()) {
              int x1, y1, w, h;
              it.get_text_bounds(0, 0, e.text.c_str(), id(f_text), TextAlign::TOP_LEFT, &x1, &y1, &w, &h);
              text_b = w + 14;
              it.print(LINKS_B - 26, zy + zh / 2, id(f_text), farbe, TextAlign::CENTER_RIGHT, e.text.c_str());
            }
            int nx = 52;
            if (e.meal) {
              it.print(nx, zy + zh / 2, id(f_symbol_klein), farbe, TextAlign::CENTER_LEFT, "\U000F065A");  // pot-steam
              nx += 24;
            }
            std::string name = kuerzen(id(f_zeile), e.name, LINKS_B - 26 - nx - text_b);
            it.print(nx, zy + zh / 2, id(f_zeile), farbe, TextAlign::CENTER_LEFT, name.c_str());
          } else if (m.art == BESTAETIGUNG) {
            it.filled_rectangle(20, ey, ZB, 36, SCHWARZ);
            it.print(32, ey + 18, id(f_hinweis), WEISS, TextAlign::CENTER_LEFT, "Erledigt? Nochmals drücken zum Bestätigen");
          } else if (m.art == ENTNAHME) {
            rahmen(20, ey, ZB, 94);
            it.print(32, ey + 8, id(f_hinweis), SCHWARZ, TextAlign::TOP_LEFT, "Wie viel entnehmen?");
            std::vector<std::string> namen;
            for (auto &o : e.optionen) namen.push_back(o.second);
            knoepfe(32, ey + 34, ZB - 24, namen, auswahl);
            it.print(32, ey + 72, id(f_klein), SCHWARZ, TextAlign::TOP_LEFT, HILFE);
          }
        }

        // Hinweis auf weitere Einträge
        int hy = liste_y + liste_h + 4;
        if (darueber && darunter)
          it.printf(LINKS_B - 26, hy, id(f_gruppe), SCHWARZ, TextAlign::TOP_RIGHT, "%d weitere oben · %d weitere unten", darueber, darunter);
        else if (darueber)
          it.printf(LINKS_B - 26, hy, id(f_gruppe), SCHWARZ, TextAlign::TOP_RIGHT, "%d weitere oben", darueber);
        else if (darunter)
          it.printf(LINKS_B - 26, hy, id(f_gruppe), SCHWARZ, TextAlign::TOP_RIGHT, "%d weitere unten", darunter);
      };

      // Kopf einer Liste: mit Homescreen eine wählbare Zeile "Zurück", rechts der Titel
      auto kopf = [&](int y, const std::string &titel) {
        if (!home_aktiv()) {
          it.print(20, y, id(f_titel), SCHWARZ, TextAlign::TOP_LEFT, titel.c_str());
          return y + 26;
        }
        const int zh = 32;
        if (cursor == 0) {
          rahmen(20, y - 4, ZB, zh);
          it.filled_triangle(30, y + 3, 30, y + 21, 45, y + 12, SCHWARZ);
        }
        it.print(52, y + 12, id(f_symbol_klein), SCHWARZ, TextAlign::CENTER_LEFT, "\U000F0141");  // chevron-left
        it.print(72, y + 12, id(f_hinweis), SCHWARZ, TextAlign::CENTER_LEFT, "Zurück");
        it.print(LINKS_B - 26, y + 12, id(f_titel), SCHWARZ, TextAlign::CENTER_RIGHT, titel.c_str());
        return y + zh + 4;
      };

      // ---- Gefrierer ----
      if (ansicht == GEFRIERER) {
        auto liste = eintraege(id(aufgaben).state);
        abgleichen(liste);
        int artikel = liste.size() - 2;  // ohne Zurück und "+ Einfrieren"
        std::string titel = "GEFRIERER";
        if (artikel > 0) titel += " · " + to_string(artikel) + " ARTIKEL";
        int liste_y = kopf(70, titel);
        liste_zeichnen(liste, liste_y, "GEFRIERER IST LEER");
      }

      // ---- Aufgaben ----
      if (ansicht == HAUSHALT) {
        auto liste = eintraege(id(aufgaben).state);
        abgleichen(liste);
        int oben_y = 70;
        if (home_aktiv()) oben_y = kopf(oben_y, "AUFGABEN") + 4;

        // Staubsauger-Zeile, immer zuoberst (unter "Zurück")
        if (!sauger_roh.empty()) {
          int liste_y = oben_y;
          auto s = sauger_lesen();
          int sauger_index = home_aktiv() ? 1 : 0;
          bool gew = cursor == sauger_index;
          bool aktiv = s.zustand != "bereit";
          std::string titel, unter;
          if (s.zustand == "geplant") { titel = "Staubsauger startet um " + s.zeit; unter = zimmer_text(s.zimmer); }
          else if (s.zustand == "saugt") { titel = "Staubsauger saugt"; unter = zimmer_text(s.zimmer); }
          else if (s.zustand == "pausiert") { titel = "Staubsauger pausiert"; unter = zimmer_text(s.zimmer); }
          else if (s.zustand == "zurueck") { titel = "Staubsauger fährt zur Station"; }
          else if (s.zustand == "reinigen") { titel = "Staubsauger zum Leeren und Reinigen"; unter = "Fertig? Drücken, dann Zur Station"; }
          else if (s.zustand == "steht") { titel = "Staubsauger steht"; unter = "nicht in der Station"; }
          else if (s.zustand == "fehler") { titel = "Staubsauger: Störung"; unter = "Details in der Roborock-App"; }
          else { titel = "Staubsaugen"; }
          auto farbe = aktiv ? WEISS : SCHWARZ;
          // Ruhig: eine Zeile wie eine Aufgabe; aktiv: schwarz, mit Untertitel
          const int zh = aktiv ? 46 : 38;
          if (aktiv) {
            it.filled_rectangle(20, liste_y, ZB, zh, SCHWARZ);
            if (gew) {
              it.rectangle(22, liste_y + 2, ZB - 4, zh - 4, WEISS);
              it.rectangle(23, liste_y + 3, ZB - 6, zh - 6, WEISS);
            }
            it.print(32, liste_y + 4, id(f_hinweis), farbe, TextAlign::TOP_LEFT, kuerzen(id(f_hinweis), titel, ZB - 24).c_str());
            it.print(32, liste_y + 26, id(f_klein), farbe, TextAlign::TOP_LEFT, kuerzen(id(f_klein), unter, ZB - 24).c_str());
          } else {
            if (gew) rahmen(20, liste_y, ZB, zh);
            else it.rectangle(20, liste_y, ZB, zh, SCHWARZ);
            it.print(32, liste_y + zh / 2, id(f_zeile), farbe, TextAlign::CENTER_LEFT, titel.c_str());
          }
          liste_y += zh + 6;

          // Menü direkt unter der Zeile
          if (gew && saug_modus()) {
            int my = liste_y, mh = 0;
            if (modus == SAUG_MENU && saug_menu_senkrecht(s.zustand)) {
              auto opt = saug_optionen(s.zustand);
              int k = opt.size();
              mh = 14 + k * 38 + 18;
              rahmen(20, my, ZB, mh);
              for (int o = 0; o < k; o++) {
                int oy = my + 10 + o * 38;
                if (o == auswahl) {
                  it.filled_rectangle(32, oy, ZB - 24, 32, SCHWARZ);
                  it.print(46, oy + 16, id(f_option), WEISS, TextAlign::CENTER_LEFT, opt[o].name);
                } else {
                  it.rectangle(32, oy, ZB - 24, 32, SCHWARZ);
                  it.print(46, oy + 16, id(f_option), SCHWARZ, TextAlign::CENTER_LEFT, opt[o].name);
                }
              }
              it.print(32, my + 12 + k * 38, id(f_klein), SCHWARZ, TextAlign::TOP_LEFT, HILFE);
            } else if (modus == SAUG_MENU) {
              auto opt = saug_optionen(s.zustand);
              std::vector<std::string> namen;
              for (auto &o : opt) namen.push_back(o.name);
              mh = 72;
              rahmen(20, my, ZB, mh);
              knoepfe(32, my + 10, ZB - 24, namen, auswahl);
              it.print(32, my + 50, id(f_klein), SCHWARZ, TextAlign::TOP_LEFT, HILFE);
            } else {
              mh = 96;
              rahmen(20, my, ZB, mh);
              std::string frage = zimmer_text(gewaehlt);
              std::vector<std::string> namen;
              int aktiv_knopf = auswahl;
              if (modus == SAUG_ZEIT) {
                frage += " saugen, Start:";
                for (int o = 0; o < ANZAHL_OPTIONEN; o++) namen.push_back(START_NAMEN[o]);
              } else {
                frage += saug_min ? " in " + to_string(saug_min) + " Min saugen?" : " jetzt saugen?";
                namen = {"Ja", "Zurück"};
              }
              it.print(32, my + 8, id(f_hinweis), SCHWARZ, TextAlign::TOP_LEFT, kuerzen(id(f_hinweis), frage, ZB - 24).c_str());
              knoepfe(32, my + 34, ZB - 24, namen, aktiv_knopf);
              it.print(32, my + 72, id(f_klein), SCHWARZ, TextAlign::TOP_LEFT, HILFE);
            }
            liste_y += mh + 6;
          }
          oben_y = liste_y + (home_aktiv() ? 0 : 8);
        }
        int liste_y = oben_y;
        if (!home_aktiv()) {
          it.print(20, oben_y, id(f_titel), SCHWARZ, TextAlign::TOP_LEFT, "AUFGABEN");
          liste_y = oben_y + 26;
        }

        if (!id(aufgaben).has_state()) {
          it.print(28, liste_y + 10, id(f_text), SCHWARZ, TextAlign::TOP_LEFT, "Warte auf Home Assistant …");
        } else {
          liste_zeichnen(liste, liste_y, "ALLES ERLEDIGT");
        }
      }

      // ---- Details rechts: zur gewählten Zeile, sonst Übersicht ----
      const int DX = LINKS_B + 21;
      const int DB = B - 18 - DX;
      if (!wetter_zeigen) {
        auto liste = eintraege(id(aufgaben).state);
        const Eintrag *e = cursor >= 0 && cursor < (int) liste.size() ? &liste[cursor] : nullptr;
        if (e && e->zurueck) e = nullptr;
        int y = 70;
        const int UNTEN = 462;
        // Überschrift wie VORMITTAG
        auto ueber = [&](const char *t) {
          y += 8;
          it.print(DX, y, id(f_titel), SCHWARZ, TextAlign::TOP_LEFT, t);
          y += 22;
        };
        // Text mit Zeilenumbruch an Leerzeichen, höchstens max Zeilen
        auto absatz = [&](esphome::font::Font *f, const std::string &text, int zh, int max) {
          std::vector<std::string> zeilen;
          std::string z;
          for (auto &w : teilen(text, ' ')) {
            std::string t = z.empty() ? w : z + " " + w;
            int x1, y1, tw, th;
            it.get_text_bounds(0, 0, t.c_str(), f, TextAlign::TOP_LEFT, &x1, &y1, &tw, &th);
            if (z.empty() || tw <= DB) z = t;
            else { zeilen.push_back(z); z = w; }
          }
          if (!z.empty()) zeilen.push_back(z);
          for (int i = 0; i < (int) zeilen.size() && i < max; i++) {
            std::string t = zeilen[i];
            // letzte erlaubte Zeile: Rest anhängen, dann kürzen
            if (i == max - 1)
              for (int r = i + 1; r < (int) zeilen.size(); r++) t += " " + zeilen[r];
            it.print(DX, y, f, SCHWARZ, TextAlign::TOP_LEFT, kuerzen(f, t, DB).c_str());
            y += zh;
          }
        };
        // Links Text, rechts Wert
        auto paar = [&](esphome::font::Font *f, const std::string &links, const std::string &rechts) {
          int x1, y1, w, h;
          it.get_text_bounds(0, 0, rechts.c_str(), f, TextAlign::TOP_LEFT, &x1, &y1, &w, &h);
          it.print(DX, y, f, SCHWARZ, TextAlign::TOP_LEFT, kuerzen(f, links, DB - w - 12).c_str());
          it.print(DX + DB, y, f, SCHWARZ, TextAlign::TOP_RIGHT, rechts.c_str());
          y += 24;
        };

        if (e && e->neu) {
          // QR-Code: neue Aufgabe bzw. einfrieren
          bool gef = ansicht == GEFRIERER;
          it.print(DX, y, id(f_qr_titel), SCHWARZ, TextAlign::TOP_LEFT, gef ? "Einfrieren" : "Neue Aufgabe");
          y += 44;
          it.qr_code(DX, y, gef ? id(qr_gefrierer) : id(qr_neue_aufgabe), SCHWARZ, 5);
          y = 300;
          it.print(DX, y, id(f_qr), SCHWARZ, TextAlign::TOP_LEFT, "Mit dem Handy scannen.");
          y += 25;
          if (gef) {
            absatz(id(f_qr), "Home Assistant öffnet das Formular zum Einfrieren.", 25, 3);
          } else {
            absatz(id(f_qr), "Home Assistant öffnet die Haushalt-Seite. Dort „Aufgabe hinzufügen“.", 25, 3);
          }
        } else if (ansicht == GEFRIERER && e) {
          // Artikel: Name gross, Kategorie, Gesamtmenge, Packungen
          absatz(id(f_qr_titel), e->name, 34, 2);
          if (!e->kategorie.empty()) {
            if (e->meal) {
              it.print(DX, y + 10, id(f_symbol_klein), SCHWARZ, TextAlign::CENTER_LEFT, "\U000F065A");
              it.print(DX + 24, y, id(f_text), SCHWARZ, TextAlign::TOP_LEFT, e->kategorie.c_str());
            } else {
              it.print(DX, y, id(f_text), SCHWARZ, TextAlign::TOP_LEFT, e->kategorie.c_str());
            }
            y += 26;
          }
          ueber("IM GEFRIERER");
          it.print(DX, y, id(f_wtemp), SCHWARZ, TextAlign::TOP_LEFT, e->menge.c_str());
          y += 28;
          if (e->ueberfaellig) {
            int x1, y1, w, h;
            std::string t = "abgelaufen " + e->rest;
            it.get_text_bounds(DX + 5, y, t.c_str(), id(f_hinweis), TextAlign::TOP_LEFT, &x1, &y1, &w, &h);
            it.filled_rectangle(DX, y - 2, w + 10, 24, SCHWARZ);
            it.print(DX + 5, y, id(f_hinweis), WEISS, TextAlign::TOP_LEFT, t.c_str());
          } else {
            it.print(DX, y, id(f_text), SCHWARZ, TextAlign::TOP_LEFT, e->rest.c_str());
          }
          y += 26;
          if (!e->packungen.empty()) {
            int n = e->packungen.size();
            ueber(n == 1 ? "PACKUNG" : (to_string(n) + " PACKUNGEN, ÄLTESTE ZUERST").c_str());
            for (int k = 0; k < n; k++) {
              if (y + 44 > UNTEN && k < n - 1) {
                it.printf(DX, y, id(f_gruppe), SCHWARZ, TextAlign::TOP_LEFT, "%d weitere", n - k);
                break;
              }
              const auto &p = e->packungen[k];
              paar(id(f_hinweis), p.menge, "bis " + p.bis);
              it.print(DX, y - 3, id(f_klein), SCHWARZ, TextAlign::TOP_LEFT, ("eingefroren " + p.eingefroren).c_str());
              y += 19;
            }
          }
        } else if (ansicht == GEFRIERER) {
          // Übersicht: Vorrat an Meal-Prep
          it.print(DX, y, id(f_qr_titel), SCHWARZ, TextAlign::TOP_LEFT, "Meal-Prep");
          y += 40;
          int n = 0, rest = 0;
          for (const auto &a : liste) {
            if (!a.meal) continue;
            if (y + 24 > UNTEN) { rest++; continue; }
            paar(id(f_text), a.name, a.menge);
            n++;
          }
          if (rest) it.printf(DX, y, id(f_gruppe), SCHWARZ, TextAlign::TOP_LEFT, "%d weitere", rest);
          if (!n) absatz(id(f_text), "Keine Meal-Prep-Portionen im Gefrierer.", 24, 2);
        } else if (e && e->sauger) {
          // Staubsauger: Zustand, Zimmer, letzter Einsatz
          auto s = sauger_lesen();
          it.print(DX, y, id(f_qr_titel), SCHWARZ, TextAlign::TOP_LEFT, "Staubsauger");
          y += 40;
          std::string zustand = "in der Station";
          if (s.zustand == "geplant") zustand = "startet um " + s.zeit;
          else if (s.zustand == "saugt") zustand = "saugt";
          else if (s.zustand == "pausiert") zustand = "pausiert";
          else if (s.zustand == "zurueck") zustand = "fährt zur Station";
          else if (s.zustand == "reinigen") zustand = "zum Leeren und Reinigen";
          else if (s.zustand == "steht") zustand = "steht, nicht in der Station";
          else if (s.zustand == "fehler") zustand = "Störung, Details in der Roborock-App";
          ueber("ZUSTAND");
          absatz(id(f_text), zustand, 24, 2);
          bool waehlt = modus == SAUG_ZEIT || modus == SAUG_FRAGE;
          if (waehlt || s.zustand == "geplant" || s.zustand == "saugt" || s.zustand == "pausiert") {
            ueber(waehlt ? "GEWÄHLT" : "ZIMMER");
            absatz(id(f_text), zimmer_text(waehlt ? gewaehlt : s.zimmer), 24, 3);
          }
          ueber("LETZTER EINSATZ");
          auto f = teilen(sauger_letzter, '|');
          if (f.size() < 4 || f[0].empty()) {
            it.print(DX, y, id(f_text), SCHWARZ, TextAlign::TOP_LEFT, "noch keiner");
          } else {
            std::string wann = f[0] + ", " + f[1] + (f[2].empty() ? " bis jetzt" : "–" + f[2]);
            it.print(DX, y, id(f_hinweis), SCHWARZ, TextAlign::TOP_LEFT, wann.c_str());
            y += 26;
            std::string zimmer;
            if (f[3] == "app") zimmer = "in der Roborock-App gestartet";
            else {
              std::vector<int> ids;
              for (auto &t : teilen(f[3], ',')) if (!t.empty()) ids.push_back(atoi(t.c_str()));
              zimmer = zimmer_text(ids);
            }
            absatz(id(f_text), zimmer, 24, 4);
          }
        } else if (e) {
          // Aufgabe: Rhythmus, zuletzt erledigt, nächste Termine
          auto d = details_fuer(e->id);
          absatz(id(f_qr_titel), e->name, 34, 2);
          it.print(DX, y, id(f_text), SCHWARZ, TextAlign::TOP_LEFT, kuerzen(id(f_text), e->text, DB).c_str());
          y += 26;
          if (!d.rhythmus.empty()) {
            ueber("RHYTHMUS");
            absatz(id(f_text), d.rhythmus, 24, 3);
          }
          if (!d.zuletzt.empty()) {
            ueber("ZULETZT ERLEDIGT");
            it.print(DX, y, id(f_text), SCHWARZ, TextAlign::TOP_LEFT, d.zuletzt.c_str());
            y += 24;
          }
          if (!d.termine.empty()) {
            ueber("NÄCHSTE TERMINE");
            for (auto &t : d.termine) {
              if (y + 24 > UNTEN) break;
              it.print(DX, y, id(f_text), SCHWARZ, TextAlign::TOP_LEFT, t.c_str());
              y += 24;
            }
          }
        } else {
          // Übersicht: überfällig, heute, morgen
          it.print(DX, y, id(f_qr_titel), SCHWARZ, TextAlign::TOP_LEFT, "Heute und morgen");
          y += 40;
          int n = 0;
          static const char *GRUPPEN[][2] = {{"Überfällig", "ÜBERFÄLLIG"}, {"Heute", "HEUTE"}, {"Morgen", "MORGEN"}};
          for (auto &g : GRUPPEN) {
            int k = std::count_if(liste.begin(), liste.end(), [&](const Eintrag &a) { return a.gruppe == g[0]; });
            if (!k || y + 54 > UNTEN) continue;
            ueber(g[1]);
            int rest = 0;
            for (const auto &a : liste) {
              if (a.gruppe != g[0]) continue;
              if (y + 24 > UNTEN) { rest++; continue; }
              it.print(DX, y, id(f_text), SCHWARZ, TextAlign::TOP_LEFT, kuerzen(id(f_text), a.name, DB).c_str());
              y += 24;
              n++;
            }
            if (rest) { it.printf(DX, y, id(f_gruppe), SCHWARZ, TextAlign::TOP_LEFT, "%d weitere", rest); y += 20; }
          }
          if (!n) absatz(id(f_text), "Nichts zu tun. Drehen zeigt Details zu jeder Aufgabe.", 24, 3);
        }
        return;
      }

      // ---- Wetter: pro Tag Vormittag und Nachmittag ----
      // Zeilen aus sensor.display_wetter: tag|zustand|max|regen|menge|zustand|max|regen|menge|min|min
      auto wort = [](const std::string &z) -> const char * {
        if (z == "sunny") return "sonnig";
        if (z == "clear-night") return "klar";
        if (z == "partlycloudy") return "teils bewölkt";
        if (z == "cloudy") return "bewölkt";
        if (z == "fog") return "Nebel";
        if (z == "hail") return "Hagel";
        if (z == "lightning" || z == "lightning-rainy") return "Gewitter";
        if (z == "rainy") return "Regen";
        if (z == "pouring") return "Starkregen";
        if (z == "snowy") return "Schnee";
        if (z == "snowy-rainy") return "Schneeregen";
        if (z == "windy" || z == "windy-variant") return "windig";
        if (z == "exceptional") return "Unwetter";
        return "";
      };
      // Echtes Minuszeichen statt Bindestrich, besser lesbar
      auto grad = [](std::string t) {
        if (!t.empty() && t[0] == '-') t = "−" + t.substr(1);
        return t + "°";
      };
      auto symbol = [](const std::string &z) -> const char * {
        if (z == "sunny" || z == "clear-night") return "\U000F0599";
        if (z == "partlycloudy") return "\U000F0595";
        if (z == "cloudy") return "\U000F0590";
        if (z == "fog") return "\U000F0591";
        if (z == "hail") return "\U000F0592";
        if (z == "lightning") return "\U000F0593";
        if (z == "lightning-rainy") return "\U000F067E";
        if (z == "rainy") return "\U000F0597";
        if (z == "pouring") return "\U000F0596";
        if (z == "snowy") return "\U000F0598";
        if (z == "snowy-rainy") return "\U000F067F";
        if (z == "windy") return "\U000F059D";
        if (z == "windy-variant") return "\U000F059E";
        return "\U000F0026";
      };
      const int WX = LINKS_B + 21;
      const int WB = B - 18 - WX;
      if (!id(wetter).has_state() || id(wetter).state.empty()) {
        it.print(WX, 110, id(f_text), SCHWARZ, TextAlign::TOP_LEFT, "Kein Wetter");
      } else {
        auto zeilen = teilen(id(wetter).state, '\n');
        for (int t = 0; t < 3 && t < (int) zeilen.size(); t++) {
          auto f = teilen(zeilen[t], '|');
          f.resize(11);
          int ty = 96 + t * 126;
          it.print(WX, ty, id(f_wtag), SCHWARZ, TextAlign::TOP_LEFT, f[0].c_str());
          for (int hf = 0; hf < 2; hf++) {
            int hx = WX + hf * (WB / 2 + 6);
            int hy = ty + 28;
            const std::string &zustand = f[1 + hf * 4], &regen = f[3 + hf * 4], &menge = f[4 + hf * 4];
            const std::string &hoch = f[2 + hf * 4], &tief = f[9 + hf];
            const int HB = WB / 2 - 6 - 42;  // Platz rechts vom Symbol
            if (hf == 1) it.filled_rectangle(hx - 8, hy, 2, 86, SCHWARZ);
            it.print(hx, hy + 30, id(f_symbol), SCHWARZ, TextAlign::CENTER_LEFT, zustand.empty() ? "" : symbol(zustand));
            // Höchst- und Tiefstwert: "13° / 5°"
            if (hoch.empty()) {
              it.print(hx + 42, hy, id(f_wtemp), SCHWARZ, TextAlign::TOP_LEFT, "–");
            } else {
              std::string h = grad(hoch);
              it.print(hx + 42, hy, id(f_wtemp), SCHWARZ, TextAlign::TOP_LEFT, h.c_str());
              if (!tief.empty()) {
                int x1, y1, w, hh;
                it.get_text_bounds(hx + 42, hy, h.c_str(), id(f_wtemp), TextAlign::TOP_LEFT, &x1, &y1, &w, &hh);
                std::string t = " / " + grad(tief);
                it.print(hx + 42 + w, hy + 4, id(f_wregen), SCHWARZ, TextAlign::TOP_LEFT, t.c_str());
              }
            }
            // Kurzer Text zum Wetter
            it.print(hx + 42, hy + 28, id(f_wtext), SCHWARZ, TextAlign::TOP_LEFT, kuerzen(id(f_wtext), wort(zustand), HB).c_str());
            // Wahrscheinlichkeit, darunter die Menge; Tropfen für Regen, Schneeflocke für Schnee
            int zeile = 0;
            for (const std::string *wert : {&regen, &menge}) {
              if (wert->empty()) continue;
              int wy = hy + 48 + zeile * 20;
              if (zeile == 0) {
                bool schnee = zustand == "snowy";
                it.print(hx + 40, wy + 10, id(f_symbol_klein), SCHWARZ, TextAlign::CENTER_LEFT, schnee ? "\U000F0717" : "\U000F058C");
              }
              it.print(hx + 62, wy, id(f_wregen), SCHWARZ, TextAlign::TOP_LEFT, wert->c_str());
              zeile++;
            }
          }
          if (t < 2) it.filled_rectangle(WX, ty + 118, WB, 2, SCHWARZ);
        }
      }
