# Flur-Display: E-Ink 7,5" (Waveshare V2) mit Drehregler, zeigt Haushalt-Aufgaben und Wetter.
# Wird als Paket in die Gerätekonfiguration eingebunden, siehe ANLEITUNG.md im selben Ordner.
# WLAN, API und OTA kommen aus der Gerätekonfiguration, die ESPHome beim Anlegen erzeugt.

substitutions:
  # Sensor für die Innentemperatur in der Kopfzeile, in der Gerätekonfiguration überschreiben
  innen_temperatur: sensor.flur_temperatur

esphome:
  includes:
    - flur_display.h
  on_boot:
    priority: -100
    then:
      - component.update: epaper

time:
  - platform: homeassistant
    id: zeit
    timezone: Europe/Zurich
    on_time_sync:
      - component.update: epaper
    on_time:
      # Alle 15 Minuten neu zeichnen, nachts (23 bis 6 Uhr) nicht
      - minutes: /15
        seconds: 0
        then:
          - if:
              condition:
                lambda: 'return id(zeit).now().hour >= 6 && id(zeit).now().hour < 23;'
              then:
                - component.update: epaper

text_sensor:
  - platform: homeassistant
    id: aufgaben
    entity_id: sensor.aufgaben
    attribute: anzeige
    on_value:
      - script.execute: daten_neu
  - platform: homeassistant
    id: saugstart
    entity_id: sensor.aufgaben
    attribute: saugstart
    on_value:
      - script.execute: daten_neu
  - platform: homeassistant
    id: wetter
    entity_id: sensor.display_wetter
    attribute: anzeige
    on_value:
      - script.execute: daten_neu

sensor:
  - platform: homeassistant
    id: innen
    entity_id: ${innen_temperatur}
  - platform: rotary_encoder
    id: regler
    pin_a:
      number: GPIO32
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO33
      mode:
        input: true
        pullup: true
    # Falls ein Rastschritt zwei Zeilen springt: auf 2 bzw. 4 erhöhen
    resolution: 1
    internal: true
    on_clockwise:
      - lambda: 'flur::drehen(1, id(aufgaben).state);'
      - script.execute: nach_eingabe
    on_anticlockwise:
      - lambda: 'flur::drehen(-1, id(aufgaben).state);'
      - script.execute: nach_eingabe

binary_sensor:
  - platform: gpio
    id: knopf
    internal: true
    pin:
      number: GPIO25
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_press:
      - lambda: 'flur::druecken(id(aufgaben).state);'
      - if:
          condition:
            lambda: 'return flur::senden;'
          then:
            - homeassistant.action:
                action: haushalt.erledigt
                data:
                  aufgabe_id: !lambda 'return flur::senden_id;'
                  start_in_min: !lambda 'return to_string(flur::senden_min);'
            - lambda: 'flur::senden = false;'
      - script.execute: nach_eingabe

switch:
  # Neuere Treiberplatinen (Rev 2.3) haben eine 9. Leitung PWR, die eingeschaltet sein muss
  - platform: gpio
    id: epaper_strom
    pin: GPIO26
    restore_mode: ALWAYS_ON
    internal: true

script:
  # Nach jeder Eingabe: sofort zeichnen, dann Zeitlimits abwarten
  - id: nach_eingabe
    mode: restart
    then:
      - component.update: epaper
      - delay: 10s
      - if:
          condition:
            lambda: 'return flur::modus == flur::BESTAETIGEN || flur::modus == flur::AUSWAHL;'
          then:
            - lambda: 'flur::auswahl_abbrechen();'
            - component.update: epaper
      - delay: 20s
      - if:
          condition:
            lambda: 'return flur::modus == flur::QR;'
          then:
            - delay: 30s
      - lambda: 'flur::ruhe();'
      - component.update: epaper
  # Neue Daten aus Home Assistant: kurz sammeln, dann zeichnen
  - id: daten_neu
    mode: restart
    then:
      - delay: 2s
      - if:
          condition:
            lambda: |-
              int h = id(zeit).now().is_valid() ? id(zeit).now().hour : 12;
              return flur::cursor >= 0 || (h >= 6 && h < 23);
          then:
            - component.update: epaper

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23

qr_code:
  - id: qr_neue_aufgabe
    value: https://my.home-assistant.io/redirect/integration/?domain=haushalt

font:
  - file: "gfonts://Inter@700"
    id: f_datum
    size: 26
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Inter@400"
    id: f_meta
    size: 17
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Inter@400"
    id: f_klein
    size: 13
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Inter@700"
    id: f_titel
    size: 15
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Inter@700"
    id: f_gruppe
    size: 13
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Inter@600"
    id: f_zeile
    size: 21
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Inter@400"
    id: f_text
    size: 17
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Inter@700"
    id: f_hinweis
    size: 17
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Inter@700"
    id: f_option
    size: 18
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Inter@700"
    id: f_wtag
    size: 19
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Inter@700"
    id: f_wtemp
    size: 22
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Inter@400"
    id: f_wregen
    size: 17
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Inter@700"
    id: f_qr_titel
    size: 28
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Inter@400"
    id: f_qr
    size: 18
    glyphsets: [GF_Latin_Core]
  # Wettersymbole und Staubsauger aus Material Design Icons
  - file:
      type: web
      url: https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/v7.4.47/fonts/materialdesignicons-webfont.ttf
    id: f_symbol
    size: 36
    glyphs: &symbole
      - "\U000F0599" # weather-sunny
      - "\U000F0595" # weather-partly-cloudy
      - "\U000F0590" # weather-cloudy
      - "\U000F0591" # weather-fog
      - "\U000F0592" # weather-hail
      - "\U000F0593" # weather-lightning
      - "\U000F067E" # weather-lightning-rainy
      - "\U000F0597" # weather-rainy
      - "\U000F0596" # weather-pouring
      - "\U000F0598" # weather-snowy
      - "\U000F067F" # weather-snowy-rainy
      - "\U000F059D" # weather-windy
      - "\U000F059E" # weather-windy-variant
      - "\U000F0026" # alert
      - "\U000F070D" # robot-vacuum

  - file:
      type: web
      url: https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/v7.4.47/fonts/materialdesignicons-webfont.ttf
    id: f_symbol_klein
    size: 18
    glyphs:
      - "\U000F058C" # water
      - "\U000F0717" # snowflake

display:
  - platform: waveshare_epaper
    id: epaper
    model: 7.50inv2p
    cs_pin: GPIO5
    dc_pin: GPIO17
    reset_pin: GPIO16
    busy_pin:
      number: GPIO4
      inverted: true
    # Teilaktualisierung beim Drehen, jede 30. Aktualisierung voll (entfernt Geisterbilder)
    full_update_every: 30
    update_interval: never
    lambda: |-
      using namespace flur;
      const int B = 800;
      const auto SCHWARZ = COLOR_ON;
      const auto WEISS = COLOR_OFF;
      it.fill(WEISS);

      // Text kürzen, bis er in die Breite passt
      auto kuerzen = [&](esphome::font::Font *f, std::string s, int breite) {
        int x1, y1, w, h;
        it.get_text_bounds(0, 0, s.c_str(), f, TextAlign::TOP_LEFT, &x1, &y1, &w, &h);
        if (w <= breite) return s;
        while (!s.empty()) {
          // ganzes UTF-8-Zeichen entfernen
          do { s.pop_back(); } while (!s.empty() && (s.back() & 0xC0) == 0x80);
          std::string t = s + "…";
          it.get_text_bounds(0, 0, t.c_str(), f, TextAlign::TOP_LEFT, &x1, &y1, &w, &h);
          if (w <= breite) return t;
        }
        return s;
      };

      // ---- Kopfzeile ----
      static const char *TAGE[] = {"Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"};
      static const char *MONATE[] = {"Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"};
      auto jetzt = id(zeit).now();
      if (jetzt.is_valid()) {
        it.printf(20, 28, id(f_datum), SCHWARZ, TextAlign::CENTER_LEFT, "%s, %d. %s",
                  TAGE[jetzt.day_of_week - 1], jetzt.day_of_month, MONATE[jetzt.month - 1]);
        it.printf(B - 20, 46, id(f_klein), SCHWARZ, TextAlign::BASELINE_RIGHT, "aktualisiert %02d:%02d", jetzt.hour, jetzt.minute);
      }
      if (id(innen).has_state()) {
        char t[16];
        snprintf(t, sizeof(t), "%.1f", id(innen).state);
        for (char *c = t; *c; c++) if (*c == '.') *c = ',';
        it.printf(B - 20, 24, id(f_meta), SCHWARZ, TextAlign::BASELINE_RIGHT, "Innen %s °C", t);
      }
      it.filled_rectangle(0, 56, B, 3, SCHWARZ);

      // ---- QR-Code für neue Aufgaben ----
      if (modus == QR) {
        it.qr_code(150, 120, id(qr_neue_aufgabe), SCHWARZ, 6);
        it.print(430, 150, id(f_qr_titel), SCHWARZ, TextAlign::TOP_LEFT, "Neue Aufgabe");
        it.print(430, 200, id(f_qr), SCHWARZ, TextAlign::TOP_LEFT, "Mit dem Handy scannen.");
        it.print(430, 225, id(f_qr), SCHWARZ, TextAlign::TOP_LEFT, "Home Assistant öffnet die");
        it.print(430, 250, id(f_qr), SCHWARZ, TextAlign::TOP_LEFT, "Haushalt-Seite.");
        it.print(430, 290, id(f_qr), SCHWARZ, TextAlign::TOP_LEFT, "Dort „Aufgabe hinzufügen“.");
        it.print(430, 340, id(f_klein), SCHWARZ, TextAlign::TOP_LEFT, "Drücken schliesst, nach 60 s automatisch");
        return;
      }

      // ---- Spalten ----
      const int LINKS_B = 470;
      it.filled_rectangle(LINKS_B, 59, 3, 480 - 59, SCHWARZ);
      it.print(20, 70, id(f_titel), SCHWARZ, TextAlign::TOP_LEFT, "AUFGABEN");
      it.print(LINKS_B + 21, 70, id(f_titel), SCHWARZ, TextAlign::TOP_LEFT, "VORMITTAG");
      it.print(LINKS_B + 21 + (800 - 18 - LINKS_B - 21) / 2 + 6, 70, id(f_titel), SCHWARZ, TextAlign::TOP_LEFT, "NACHMITTAG");

      // ---- Aufgabenliste ----
      int liste_y = 96;
      int liste_h = 332;
      if (!id(saugstart).state.empty()) {
        it.filled_rectangle(20, liste_y, LINKS_B - 36, 46, SCHWARZ);
        it.print(32, liste_y + 23, id(f_symbol), WEISS, TextAlign::CENTER_LEFT, "\U000F070D");
        it.printf(78, liste_y + 4, id(f_hinweis), WEISS, TextAlign::TOP_LEFT, "Staubsauger startet um %s", id(saugstart).state.c_str());
        it.print(78, liste_y + 26, id(f_klein), WEISS, TextAlign::TOP_LEFT, "ganze Wohnung");
        liste_y += 52;
        liste_h -= 52;
      }

      if (!id(aufgaben).has_state()) {
        it.print(28, liste_y + 10, id(f_text), SCHWARZ, TextAlign::TOP_LEFT, "Warte auf Home Assistant …");
      } else {
        auto liste = eintraege(id(aufgaben).state);
        abgleichen(liste);

        // Elemente der Liste mit ihrer Höhe: Gruppenkopf, Zeile, Zusatz unter der gewählten Zeile
        enum Art { KOPF, ZEILE, BESTAETIGUNG, OPTIONEN };
        struct Element { Art art; int index; int h; std::string text; };
        std::vector<Element> el;
        std::string gruppe = "-";
        bool nur_neu = liste.size() == 1;
        for (int i = 0; i < (int) liste.size(); i++) {
          const auto &e = liste[i];
          if (e.neu) {
            el.push_back({KOPF, -1, 22, nur_neu ? "ALLES ERLEDIGT" : ""});
          } else if (e.gruppe != gruppe) {
            gruppe = e.gruppe;
            std::string g = gruppe;
            std::transform(g.begin(), g.end(), g.begin(), ::toupper);
            if (g == "ÜBERFÄLLIG" || g == "Überfällig") g = "ÜBERFÄLLIG";
            else if (gruppe == "Nächste Tage") g = "NÄCHSTE TAGE";
            el.push_back({KOPF, -1, 22, g});
          }
          el.push_back({ZEILE, i, 40, ""});
          if (i == cursor && modus == BESTAETIGEN) el.push_back({BESTAETIGUNG, i, 40, ""});
          if (i == cursor && modus == AUSWAHL) el.push_back({OPTIONEN, i, 96, ""});
        }

        // Sichtbaren Ausschnitt so legen, dass die gewählte Zeile ganz zu sehen ist
        int n = el.size();
        std::vector<int> y(n + 1, 0);
        for (int k = 0; k < n; k++) y[k + 1] = y[k] + el[k].h;
        if (cursor < 0) {
          oben = 0;
        } else {
          int sel = 0;
          while (sel < n && !(el[sel].art == ZEILE && el[sel].index == cursor)) sel++;
          int ende = sel + 1;
          while (ende < n && (el[ende].art == BESTAETIGUNG || el[ende].art == OPTIONEN)) ende++;
          int start = (sel > 0 && el[sel - 1].art == KOPF) ? sel - 1 : sel;
          oben = std::min(oben, n - 1);
          if (start < oben) oben = start;
          while (y[ende] - y[oben] > liste_h && oben < sel) oben++;
        }

        int darueber = 0, darunter = 0;
        for (int k = 0; k < oben; k++) if (el[k].art == ZEILE) darueber++;
        int ende = oben;
        while (ende < n && y[ende + 1] - y[oben] <= liste_h) ende++;
        // Gruppenkopf nicht allein am unteren Rand
        if (ende > oben && el[ende - 1].art == KOPF) ende--;
        for (int k = ende; k < n; k++) if (el[k].art == ZEILE) darunter++;

        for (int k = oben; k < ende; k++) {
          const auto &m = el[k];
          int ey = liste_y + y[k] - y[oben];
          if (m.art == KOPF) {
            it.print(28, ey + 7, id(f_gruppe), SCHWARZ, TextAlign::TOP_LEFT, m.text.c_str());
            continue;
          }
          const auto &e = liste[m.index];
          bool gewaehlt = m.index == cursor;
          if (m.art == ZEILE) {
            int zy = ey + 2, zh = 36;
            auto farbe = e.ueberfaellig ? WEISS : SCHWARZ;
            if (e.ueberfaellig) it.filled_rectangle(20, zy, LINKS_B - 36, zh, SCHWARZ);
            if (gewaehlt) {
              if (e.ueberfaellig) {
                it.rectangle(24, zy + 4, LINKS_B - 44, zh - 8, WEISS);
                it.rectangle(25, zy + 5, LINKS_B - 46, zh - 10, WEISS);
              } else {
                for (int d = 0; d < 3; d++) it.rectangle(20 + d, zy + d, LINKS_B - 36 - 2 * d, zh - 2 * d, SCHWARZ);
              }
              it.filled_triangle(30, zy + 9, 30, zy + 27, 45, zy + 18, farbe);
            }
            int text_b = 0;
            if (!e.text.empty()) {
              int x1, y1, w, h;
              it.get_text_bounds(0, 0, e.text.c_str(), id(f_text), TextAlign::TOP_LEFT, &x1, &y1, &w, &h);
              text_b = w + 14;
              it.print(LINKS_B - 26, zy + zh / 2, id(f_text), farbe, TextAlign::CENTER_RIGHT, e.text.c_str());
            }
            std::string name = kuerzen(id(f_zeile), e.name, LINKS_B - 26 - 52 - text_b);
            it.print(52, zy + zh / 2, id(f_zeile), farbe, TextAlign::CENTER_LEFT, name.c_str());
          } else if (m.art == BESTAETIGUNG) {
            it.filled_rectangle(20, ey, LINKS_B - 36, 36, SCHWARZ);
            it.print(32, ey + 18, id(f_hinweis), WEISS, TextAlign::CENTER_LEFT, "Erledigt? Nochmals drücken zum Bestätigen");
          } else if (m.art == OPTIONEN) {
            for (int d = 0; d < 3; d++) it.rectangle(20 + d, ey - 2 + d, LINKS_B - 36 - 2 * d, 94 - 2 * d, SCHWARZ);
            it.print(32, ey + 6, id(f_hinweis), SCHWARZ, TextAlign::TOP_LEFT, "Erledigt. Staubsauger starten:");
            static const char *NAMEN[] = {"sofort", "5 Min", "20 Min", "60 Min"};
            int ob = (LINKS_B - 36 - 24 - 3 * 8) / 4;
            for (int o = 0; o < ANZAHL_OPTIONEN; o++) {
              int ox = 32 + o * (ob + 8);
              if (o == auswahl) {
                it.filled_rectangle(ox, ey + 32, ob, 32, SCHWARZ);
                it.print(ox + ob / 2, ey + 48, id(f_option), WEISS, TextAlign::CENTER, NAMEN[o]);
              } else {
                it.rectangle(ox, ey + 32, ob, 32, SCHWARZ);
                it.rectangle(ox + 1, ey + 33, ob - 2, 30, SCHWARZ);
                it.print(ox + ob / 2, ey + 48, id(f_option), SCHWARZ, TextAlign::CENTER, NAMEN[o]);
              }
            }
            it.print(32, ey + 70, id(f_klein), SCHWARZ, TextAlign::TOP_LEFT, "Drehen wählt · Drücken bestätigt · 10 s warten bricht ab");
          }
        }

        // Hinweis auf weitere Einträge
        int hy = liste_y + liste_h + 4;
        if (darueber && darunter)
          it.printf(LINKS_B - 26, hy, id(f_gruppe), SCHWARZ, TextAlign::TOP_RIGHT, "%d weitere oben · %d weitere unten", darueber, darunter);
        else if (darueber)
          it.printf(LINKS_B - 26, hy, id(f_gruppe), SCHWARZ, TextAlign::TOP_RIGHT, "%d weitere oben", darueber);
        else if (darunter)
          it.printf(LINKS_B - 26, hy, id(f_gruppe), SCHWARZ, TextAlign::TOP_RIGHT, "%d weitere unten", darunter);
      }

      // ---- Wetter: pro Tag Vormittag und Nachmittag ----
      // Zeilen aus sensor.display_wetter: tag|zustand|temp|regen|zustand|temp|regen
      auto symbol = [](const std::string &z) -> const char * {
        if (z == "sunny" || z == "clear-night") return "\U000F0599";
        if (z == "partlycloudy") return "\U000F0595";
        if (z == "cloudy") return "\U000F0590";
        if (z == "fog") return "\U000F0591";
        if (z == "hail") return "\U000F0592";
        if (z == "lightning") return "\U000F0593";
        if (z == "lightning-rainy") return "\U000F067E";
        if (z == "rainy") return "\U000F0597";
        if (z == "pouring") return "\U000F0596";
        if (z == "snowy") return "\U000F0598";
        if (z == "snowy-rainy") return "\U000F067F";
        if (z == "windy") return "\U000F059D";
        if (z == "windy-variant") return "\U000F059E";
        return "\U000F0026";
      };
      const int WX = LINKS_B + 21;
      const int WB = B - 18 - WX;
      if (!id(wetter).has_state() || id(wetter).state.empty()) {
        it.print(WX, 110, id(f_text), SCHWARZ, TextAlign::TOP_LEFT, "Kein Wetter");
      } else {
        auto zeilen = teilen(id(wetter).state, '\n');
        for (int t = 0; t < 3 && t < (int) zeilen.size(); t++) {
          auto f = teilen(zeilen[t], '|');
          f.resize(7);
          int ty = 96 + t * 126;
          it.print(WX, ty, id(f_wtag), SCHWARZ, TextAlign::TOP_LEFT, f[0].c_str());
          for (int hf = 0; hf < 2; hf++) {
            int hx = WX + hf * (WB / 2 + 6);
            int hy = ty + 28;
            const std::string &zustand = f[1 + hf * 3], &regen = f[3 + hf * 3];
            std::string temp = f[2 + hf * 3];
            if (hf == 1) it.filled_rectangle(hx - 8, hy, 2, 62, SCHWARZ);
            it.print(hx, hy + 30, id(f_symbol), SCHWARZ, TextAlign::CENTER_LEFT, zustand.empty() ? "" : symbol(zustand));
            // Echtes Minuszeichen statt Bindestrich, besser lesbar
            if (!temp.empty() && temp[0] == '-') temp = "−" + temp.substr(1);
            if (temp.empty())
              it.print(hx + 42, hy + 2, id(f_wtemp), SCHWARZ, TextAlign::TOP_LEFT, "–");
            else
              it.printf(hx + 42, hy + 2, id(f_wtemp), SCHWARZ, TextAlign::TOP_LEFT, "%s°", temp.c_str());
            if (!regen.empty()) {
              // Tropfen für Regen, Schneeflocke für Schnee
              bool schnee = zustand == "snowy";
              it.print(hx + 40, hy + 44, id(f_symbol_klein), SCHWARZ, TextAlign::CENTER_LEFT, schnee ? "\U000F0717" : "\U000F058C");
              it.print(hx + 62, hy + 34, id(f_wregen), SCHWARZ, TextAlign::TOP_LEFT, regen.c_str());
            }
          }
          if (t < 2) it.filled_rectangle(WX, ty + 118, WB, 2, SCHWARZ);
        }
      }
